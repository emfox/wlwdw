android.nonFinalResIds=false

# Each module resolves only its own R class now (the modern default), which
# trims resource compilation. Was false, i.e. the old non-transitive-off
# behaviour.
android.nonTransitiveRClass=true
android.useAndroidX=true

# Jetifier was removed: every dependency is already AndroidX, so all it did was
# slow the build down.
