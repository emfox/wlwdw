# JVM memory for the Gradle daemon. The Gradle default (512 MiB heap, 384 MiB
# metaspace) is not enough once a module compiles Compose: the daemon aborts
# partway through compilation with "the JVM garbage collector is thrashing".
# 2 GiB heap is comfortable for this project and leaves room on a machine that
# is also running the IDE.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# The Kotlin compiler runs in its own daemon, which is a separate process from
# the Gradle daemon and is sized separately.
kotlin.daemon.jvmargs=-Xmx1g

# Reuse the result of the configuration phase between builds. Measured on this
# project: `assembleDebug` with nothing to do drops from ~21s to ~9s, because
# configuring this project costs ~30s on its own (`gradlew help` alone takes
# that long) and this removes that cost from every build after the first.
org.gradle.configuration-cache=true

# Reuse task outputs across builds, so a `clean` does not have to recompile
# Compose from scratch.
org.gradle.caching=true

android.nonFinalResIds=false

# Each module resolves only its own R class now (the modern default), which
# trims resource compilation. Was false, i.e. the old non-transitive-off
# behaviour.
android.nonTransitiveRClass=true
android.useAndroidX=true

# Jetifier was removed: every dependency is already AndroidX, so all it did was
# slow the build down.
