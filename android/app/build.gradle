apply plugin: 'com.android.application'

// Local secrets for the MQTT device credential and the Baidu Map/Location API
// key. Read from the untracked ../gradle-local.properties (see
// gradle-local.properties.example); a missing file falls back to placeholders
// so the project still builds from a fresh checkout without ever committing a
// real secret. Keep MQTT_DEVICE_SHARED_SECRET identical to the server-side
// .env of the wlwdw app, and BAIDU_MAP_AK bound to this app's package + signing
// SHA1 on the Baidu console.
def localProps = new Properties()
def localPropsFile = file('../gradle-local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def mqttDeviceSharedSecret = localProps.getProperty(
        'MQTT_DEVICE_SHARED_SECRET', 'wlwdw-device-secret-CHANGE-ME')
def baiduMapAk = localProps.getProperty('BAIDU_MAP_AK', 'change_me_baidu_map_ak')

android {
    compileSdkVersion 36

    defaultConfig {
        applicationId "com.wlwdw.gps1s"
        minSdkVersion 26
        // Deliberately 34, not 35+: at 35+ Android 15 limits dataSync
        // foreground services to 6h per 24h, which would kill the long-lived
        // MQTT push service on Android 15/16 devices (and forces edge-to-edge).
        targetSdkVersion 34
        buildConfigField 'String', 'MQTT_DEVICE_SHARED_SECRET',
                "\"${mqttDeviceSharedSecret}\""
        manifestPlaceholders = [
                'BAIDU_MAP_AK': baiduMapAk,
        ]
    }
    buildFeatures {
        buildConfig true
    }
    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    namespace 'com.wlwdw.gps1s'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.baidu.lbsyun:BaiduMapSDK_Map:8.2.0'
    implementation 'com.baidu.lbsyun:BaiduMapSDK_Location_All:9.6.9'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.cursoradapter:cursoradapter:1.0.0' // SimpleCursorAdapter in MessageActivity
    implementation 'com.google.android.material:material:1.14.0'
    // MQTT push over WSS to the self-hosted EMQX broker. HiveMQ client supports
    // MQTT over WebSockets (Paho Java does not); the -shaded artifact bundles
    // its transitive netty deps under a renamed package to avoid conflicts on
    // Android.
    implementation 'com.hivemq:hivemq-mqtt-client-shaded:1.4.0'
}
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(11)
    }
}
