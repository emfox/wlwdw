plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
}

// Local secrets: MQTT device credential, Baidu Map/Location API key and the
// release signing keystore. Read from the untracked ../gradle-local.properties
// (see gradle-local.properties.example); a missing file falls back to
// placeholders so the project still builds from a fresh checkout without ever
// committing a real secret. Keep MQTT_DEVICE_SHARED_SECRET identical to the
// server-side .env of the wlwdw app, BAIDU_MAP_AK bound to this app's package
// + signing SHA1 on the Baidu console, and the release keystore backed up
// somewhere safe (it signs every distributed APK).
def localProps = new Properties()
def localPropsFile = file('../gradle-local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def mqttDeviceSharedSecret = localProps.getProperty(
        'MQTT_DEVICE_SHARED_SECRET', 'wlwdw-device-secret-CHANGE-ME')
def baiduMapAk = localProps.getProperty('BAIDU_MAP_AK', 'change_me_baidu_map_ak')

// Release signing. The keystore path is relative to android/ (where
// gradle-local.properties lives). If the file or passwords are absent the
// release build is left unsigned instead of failing at configuration time.
def releaseKeystore = file('../' + localProps.getProperty(
        'RELEASE_KEYSTORE_PATH', 'keystore/release.jks'))
def hasReleaseSigning = releaseKeystore.exists()
        && !localProps.getProperty('RELEASE_STORE_PASSWORD', '').isEmpty()

android {
    compileSdkVersion 36

    defaultConfig {
        applicationId "org.rpwt.wlwdw"
        minSdkVersion 26
        // Deliberately 34, not 35+: at 35+ Android 15 limits dataSync
        // foreground services to 6h per 24h, which would kill the long-lived
        // MQTT push service on Android 15/16 devices (and forces edge-to-edge).
        // The service is long-lived message delivery, not data sync, so the way
        // off this pin is to re-declare it as specialUse (or connectedDevice) —
        // neither of those types has a time limit.
        targetSdkVersion 34
        buildConfigField 'String', 'MQTT_DEVICE_SHARED_SECRET',
                "\"${mqttDeviceSharedSecret}\""
        manifestPlaceholders = [
                'BAIDU_MAP_AK': baiduMapAk,
        ]
    }
    buildFeatures {
        buildConfig true
    }
    signingConfigs {
        release {
            storeFile releaseKeystore
            storePassword localProps.getProperty('RELEASE_STORE_PASSWORD', '')
            keyAlias localProps.getProperty('RELEASE_KEY_ALIAS', 'release')
            keyPassword localProps.getProperty('RELEASE_KEY_PASSWORD', '')
        }
    }
    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
            signingConfig hasReleaseSigning ? signingConfigs.release : null
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    namespace 'org.rpwt.wlwdw'
}

// Kotlin is here so new code can be written in Kotlin from now on; the
// existing Java sources are untouched. The plugin compiles Java and Kotlin
// sources of the same module together, and Kotlin can call into the Java side,
// so the port can be done file by file instead of as one big drop.
//
// jvmTarget must match the Java compileOptions above. The Kotlin plugin
// validates that pairing at configuration time and fails when the two differ
// (jvmTargetValidationMode defaults to ERROR). Kotlin's own default is 1.8
// today, but pinning it explicitly keeps the two aligned if that default ever
// moves. Note the `.set(...)` call — jvmTarget is a Property<JvmTarget>, not a
// plain field, so a Groovy `=` assignment would not bind to it.
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinJvmCompile).configureEach {
    compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8)
}

dependencies {
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.preference
    implementation libs.androidx.cursoradapter
    implementation libs.androidx.localbroadcastmanager
    implementation libs.baidu.map.sdk
    implementation libs.baidu.location.sdk
    // MQTT push over WSS to the self-hosted EMQX broker. HiveMQ client supports
    // MQTT over WebSockets (Paho Java does not); the -shaded artifact bundles
    // its transitive netty deps under a renamed package to avoid conflicts on
    // Android. The Kotlin stdlib is added automatically by the Kotlin plugin.
    implementation libs.hivemq.mqtt.client.shaded
}
// No java toolchain pinned: compilation follows the Gradle daemon JVM. (AGP
// 8.9 already requires JDK 17+, so the former hardcoded JDK 11 toolchain was
// both unnecessary and forced a JDK download on machines without one.)
