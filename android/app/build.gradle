import javax.inject.Inject
import org.gradle.api.file.DirectoryProperty
import org.gradle.api.file.FileSystemOperations
import org.gradle.api.tasks.InputDirectory
import org.gradle.api.tasks.OutputDirectory
import org.gradle.api.tasks.TaskAction

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.kotlin.serialization)
    // Room's annotation processor runs through KSP.
    alias(libs.plugins.ksp)
}

// Local secrets: the MQTT device credential and the release signing keystore.
// Read from the untracked ../gradle-local.properties (see
// gradle-local.properties.example); a missing file falls back to placeholders
// so the project still builds from a fresh checkout without ever committing a
// real secret. Keep MQTT_DEVICE_SHARED_SECRET identical to the server-side
// .env of the wlwdw app, and back the release keystore up somewhere safe (it
// signs every distributed APK).
def localProps = new Properties()
def localPropsFile = file('../gradle-local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def mqttDeviceSharedSecret = localProps.getProperty(
        'MQTT_DEVICE_SHARED_SECRET', 'wlwdw-device-secret-CHANGE-ME')

// The 天地图 key the bundled map shell boots the JS API with.
//
// The default is the key the website already ships. It is printed in the page
// source of /main/tianditu, so it is not a secret, and a working default is
// what makes a fresh checkout build a working map. Override it in
// gradle-local.properties to point the app at a different 天地图 account --
// checked for emptiness as well as absence, because an unset property in that
// file would otherwise arrive here as a key of "".
//
// The key is a "browser" type: 天地图 validates it on the User-Agent, not on
// the Referer, so a WebView (which is a browser) may use it from any origin.
// That is also why neither a SHA-1 nor a package name is involved -- those
// belong to the Android SDK key type, which this app does not use.
def tiandituMapKey = localProps.getProperty('TIANDITU_MAP_KEY', '').trim()
if (!tiandituMapKey) {
    tiandituMapKey = 'b5bb34da347fc471d4b0d9c453dd1f58'
}

// Release signing. The keystore path is relative to android/ (where
// gradle-local.properties lives). If the file or passwords are absent the
// release build is left unsigned instead of failing at configuration time.
def releaseKeystore = file('../' + localProps.getProperty(
        'RELEASE_KEYSTORE_PATH', 'keystore/release.jks'))
def hasReleaseSigning = releaseKeystore.exists()
        && !localProps.getProperty('RELEASE_STORE_PASSWORD', '').isEmpty()

android {
    // 37 comes with the AGP 9.4 upgrade: it is the highest API level AGP 9.4
    // supports, and the Compose 1.12.x / core-ktx 1.19.x / navigation 2.10.x
    // line requires minCompileSdk 37 in its AAR metadata. API 37 uses minor
    // versioned platforms, installed here as platforms;android-37.0.
    compileSdk = 37

    defaultConfig {
        applicationId "org.rpwt.wlwdw"
        minSdk = 26
        // Deliberately 34, not 35+: at 35+ Android 15 limits dataSync
        // foreground services to 6h per 24h, which would kill the long-lived
        // MQTT push service on Android 15/16 devices (and forces edge-to-edge).
        // The service is long-lived message delivery, not data sync, so the way
        // off this pin is to re-declare it as specialUse (or connectedDevice) —
        // neither of those types has a time limit.
        targetSdk = 34
        buildConfigField 'String', 'MQTT_DEVICE_SHARED_SECRET',
                "\"${mqttDeviceSharedSecret}\""
        buildConfigField 'String', 'TIANDITU_MAP_KEY',
                "\"${tiandituMapKey}\""
    }
    buildFeatures {
        buildConfig true
        compose true
    }
    signingConfigs {
        release {
            storeFile releaseKeystore
            storePassword localProps.getProperty('RELEASE_STORE_PASSWORD', '')
            keyAlias localProps.getProperty('RELEASE_KEY_ALIAS', 'release')
            keyPassword localProps.getProperty('RELEASE_KEY_PASSWORD', '')
        }
    }
    buildTypes {
        // proguard-android-optimize.txt, not proguard-android.txt: AGP 9 rejects
        // the latter outright because it carries -dontoptimize and so switches
        // off most of R8. Minification is off in both build types today, so
        // this only really decides what happens the day it is turned on.
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
            signingConfig hasReleaseSigning ? signingConfigs.release : null
        }
    }
    // 17 matches the JDK AGP 9.4 builds with (its compatibility table lists JDK
    // 17 as both minimum and default). Kotlin's jvmTarget has to match these,
    // or the Kotlin plugin fails configuration with a validation error.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        // The interface is Chinese and the English locale carries the product
        // name only -- see the note in src/main/res/values-en/strings.xml. Lint
        // reads that as 89 missing translations; the decision was deliberate, so
        // the check is off rather than the file duplicated. Re-enable it the day
        // the UI itself is translated.
        disable += 'MissingTranslation'
    }
    namespace 'org.rpwt.wlwdw'
}

// --- The map shell's assets -------------------------------------------------
// `public/js/wlwdw-map/` is the single source of truth for how this project
// draws a map -- the website loads it from a browser and the app loads the same
// files in a WebView. Rather than keeping a second copy under src/main/assets
// that would silently drift the first time someone edited a provider, the few
// files the shell needs are copied into the build directory and that directory
// is folded into the app's assets. Editing public/js/wlwdw-map/core.js and
// rebuilding is all it takes for the app to pick the change up.
//
// The layout under `web/` mirrors `public/`, so relative references inside the
// JS (Marker_Pin, Anchor_Path + icon) resolve to the same paths they do on the
// website, and the JS itself needs no edit to run here.
//
// Why a hand-written task rather than Sync/Copy: the Variant API's
// addGeneratedSourceDirectory() requires the task's output to be declared as a
// DirectoryProperty, and Sync only exposes a File-typed destination. Passing a
// Provider through the older SourceSet API instead is something AGP 9 refuses
// outright -- it cannot tell generated files from static ones, and so cannot
// wire the task dependency.
abstract class SyncWebMapAssets extends org.gradle.api.DefaultTask {

    /** The website's public/ directory. */
    @InputDirectory
    abstract DirectoryProperty getSource()

    /** Where the app's assets are assembled; wired into the variants below. */
    @OutputDirectory
    abstract DirectoryProperty getDestination()

    @Inject
    abstract FileSystemOperations getFs()

    @TaskAction
    void sync() {
        def src = source.get().asFile
        // Cleared first: a file deleted from public/ has to disappear from the
        // assets too, which a plain copy would leave behind.
        fs.delete { delete(destination) }

        copy('js/wlwdw-map', 'web/js/wlwdw-map', ['core.js', 'tianditu.js'])
        copy('vendor/jquery', 'web/vendor/jquery', ['jquery.min.js'])
        copy('vendor/proj4', 'web/vendor/proj4', ['proj4.js'])
        copy('images', 'web/images',
                ['Marker_Blank.png', 'Marker_Pin.png', 'Marker_Point.png'])
        copy('images/anchors', 'web/images/anchors', null)
    }

    // The parameters are deliberately not called from/into: a local of either
    // name shadows CopySpec's own methods inside the closure, and the call
    // then fails as "no signature of method: java.lang.String.call()".
    private void copy(String sourceDir, String targetDir, List<String> only) {
        def out = destination.get().asFile
        fs.copy {
            from(new File(source.get().asFile, sourceDir))
            into(new File(out, targetDir))
            only?.each { include(it) }
        }
    }
}

def syncWebAssets = tasks.register('syncWebAssets', SyncWebMapAssets) {
    source.set(file("${rootProject.projectDir}/../public"))
    destination.set(layout.buildDirectory.dir('wlwdw-web-assets'))
}

// Belt and braces: the primary wiring is the variant below, but the preBuild
// hook makes the ordering visible in a task list too.
tasks.named('preBuild').configure { dependsOn(syncWebAssets) }

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.assets?.addGeneratedSourceDirectory(syncWebAssets) { it.destination }
    }
}

// Kotlin compiler options. With built-in Kotlin this is the kotlin{} extension
// rather than the old android.kotlinOptions{} block, which AGP 9 removed.
// jvmTarget must match the Java compileOptions above.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

// Room exports the schema it generates, which is what a migration is written
// against later. The processor only warns that it cannot export if this is
// missing, but an exported schema is the difference between writing a migration
// and guessing at one.
ksp {
    arg('room.schemaLocation', "$projectDir/schemas")
}

dependencies {
    // --- The rewritten UI (ui/ package): Compose single-activity app ---
    // The BOM has to be imported before the compose artifacts so their versions
    // resolve from it.
    implementation platform(libs.compose.bom)
    implementation libs.androidx.core.ktx
    implementation libs.androidx.activity.compose
    implementation libs.androidx.navigation.compose
    implementation libs.compose.ui
    implementation libs.compose.ui.graphics
    implementation libs.compose.ui.tooling.preview
    implementation libs.compose.foundation
    implementation libs.compose.material3
    implementation libs.compose.material.icons.extended
    implementation libs.kotlinx.serialization.json
    debugImplementation libs.compose.ui.tooling

    // --- The map (ui/screen/MapScreen) ---
    // WebViewAssetLoader only. The map itself is the website's own JS, which
    // the syncWebAssets task above copies out of public/ into the APK.
    implementation libs.androidx.webkit

    // --- The data layer (data/ package) ---
    // DataStore holds the settings; the ViewModel pieces are what lets a screen
    // read it as state instead of holding its own copy.
    implementation libs.androidx.datastore.preferences
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.lifecycle.runtime.compose
    // Room replaces the pre-rewrite MsgdbHelper. The compiler is a KSP
    // processor, so it is added with ksp() rather than implementation().
    implementation libs.androidx.room.runtime
    implementation libs.androidx.room.ktx
    ksp libs.androidx.room.compiler

    // --- The network layer (data/net package) ---
    // The report call and the message pull share one client; the MQTT link has
    // its own transport and does not go through Ktor.
    implementation libs.ktor.client.core
    implementation libs.ktor.client.okhttp
    implementation libs.ktor.client.content.negotiation
    implementation libs.ktor.serialization.kotlinx.json

    // --- The push link (push/ package) ---
    // MQTT over WebSockets, which is the only way through the front proxy that
    // shares the server's hostname with the site.
    implementation libs.hivemq.mqtt.client.shaded

    // --- Tests (src/test) ---
    // Plain JUnit, run by `./gradlew test` with no emulator and no Robolectric.
    // That is the point of the loop's collaborators being interfaces: the
    // interesting decisions (a deny stops the loop, an upload failure does not)
    // are testable without a device.
    testImplementation libs.junit
    testImplementation libs.kotlinx.coroutines.test
    // MockEngine, for the two things only a real request can prove: the exact
    // URL and body WlwdwApi builds, and that a HTTP 200 "deny" reads as
    // "unknown device" rather than as success.
    testImplementation libs.ktor.client.mock
}
// No java toolchain pinned: compilation follows the Gradle daemon JVM. (AGP
// 9.4 requires JDK 17+, so the former hardcoded JDK 11 toolchain was both
// unnecessary and forced a JDK download on machines without one.)
