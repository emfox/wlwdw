distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# 9.6.0 is the minimum and the default Gradle version for AGP 9.4 (the AGP 9.4
# release notes list both); the two are kept in step on purpose. See the version
# policy note in gradle/libs.versions.toml.
distributionUrl=https\://services.gradle.org/distributions/gradle-9.6.0-all.zip
networkTimeout=10000
retries=0
retryBackOffMs=500
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
