# Gradle version catalog — the single source of truth for plugin and dependency
# versions. Build scripts refer to entries as `libs.<dotted-alias>`, so a
# version is only ever written down here.
#
# Version policy: everything sits at the newest stable release the build chain
# supports. AGP 9.4 is the ceiling for API 37 — its release notes say "the
# maximum API level that AGP 9.4 supports is API level 37", so compileSdk 37
# and AGP 9.4 are the pair to move together. Requirements read off the AGP 9.4
# compatibility table (2026-10-02): Gradle >= 9.6.0, JDK >= 17, KGP >= 2.2.10,
# SDK Build Tools >= 36.0.0.
#
# Kotlin version: AGP 9 compiles Kotlin built-in and 9.4.1 bundles KGP 2.2.10,
# but it honours a newer KGP if one is on the build classpath — which is what
# the buildscript block in the root build.gradle is for. This entry therefore
# feeds only the Compose and serialization compiler plugins (they ship with
# Kotlin and must match the compiler); the compiler itself comes from that
# classpath. The two have to agree or the build fails, so change them together.

[versions]
agp = "9.4.1"
kotlin = "2.4.20"

# Jetpack Compose. The BOM is the only place a compose version is written down:
# every androidx.compose.* artifact below is version-less and resolved by it.
# The BOM carries compose-ui 1.12.1, material3 1.4.0 and material-icons 1.7.8;
# material3 has been 1.4.0 since 2025.10 while ui keeps moving, so the M3
# Expressive navigation components the design asks for are unaffected by bumps.
composeBom = "2026.09.00"
activityCompose = "1.13.0"
navigationCompose = "2.10.2"
coreKtx = "1.19.1"
# Needed by the type-safe navigation routes (@Serializable destination objects).
kotlinxSerialization = "1.11.0"

# --- Data layer (the data/ package) ---
# DataStore Preferences replaces the SharedPreferences the pre-rewrite app used.
# 1.2.1 is the newest stable: 1.3.0 is still in alpha.
dataStore = "1.2.1"
# ViewModel + collectAsStateWithLifecycle for the Compose screens. 2.11.0 is
# the newest stable (2.12 is alpha), and it is the line navigation 2.10 pulls in.
lifecycle = "2.11.0"
# Room 3 is the object mapping the pre-rewrite MsgdbHelper did by hand.
room = "2.8.5"
# KSP runs Room's annotation processor. Since 2.3 it is versioned on its own
# rather than as "<kotlin>-<ksp>", so it no longer has to match the Kotlin
# version -- which is what makes it usable with the Kotlin 2.4.20 the build
# needs. Change it on its own.
ksp = "2.3.12"

# --- Network (the data/net package) ---
# Ktor replaces the HttpURLConnection the pre-rewrite app used by hand. The
# OkHttp engine rather than Ktor's own CIO: on Android it is the one that uses
# the platform TLS stack and does connection pooling, which matters for an app
# that talks to the same host every couple of minutes.
ktor = "3.6.0"

# --- Tests (src/test) ---
# Plain JVM tests: no Robolectric and no device. That is possible because the
# tracking loop is a plain coroutine whose three collaborators are interfaces
# (ReportSender / LocationProvider / ReportLog), so a test can drive it without
# a database, a Context or an HTTP server. JUnit 4 rather than 5 because AGP's
# unit-test task is wired for it out of the box.
junit = "4.13.2"
# Has to equal the kotlinx-coroutines-core the app resolves -- the test artifact
# and the core artifact are released together and are not compatible across
# versions. 1.11.0 is what Ktor 3.6 and lifecycle 2.11 pull in today; re-check
# with `./gradlew :app:dependencies --configuration debugRuntimeClasspath` the
# day that changes, rather than bumping this on its own.
kotlinxCoroutines = "1.11.0"

[libraries]
# --- Compose UI stack (the whole app UI; see the ui/ package) ---
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

# --- Data layer ---
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "dataStore" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }

# --- Data layer: the message store ---
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
# room-ktx: the Flow-returning DAO queries and suspend transactions.
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# --- Network ---
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
# ContentNegotiation + the kotlinx JSON converter: the pair that turns a
# @Serializable class into the request body and the response body back.
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

# --- Tests ---
junit = { module = "junit:junit", version.ref = "junit" }
# runTest and virtual time: the tracking loop sleeps for minutes between ticks,
# and a test that actually waited would not be run.
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
# MockEngine: asserts on the exact request WlwdwApi makes, and answers with a
# canned body -- including the HTTP 200 + {"result":"deny"} the server uses to
# say "unknown device" without letting the status code be used to enumerate ids.
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# No kotlin-android entry: AGP 9.0 and later compile Kotlin themselves, and
# applying org.jetbrains.kotlin.android alongside built-in Kotlin fails with
# "Cannot add extension with name 'kotlin'".
# Required since Kotlin 2.0: the Compose compiler ships as a Kotlin plugin and
# its version has to track the Kotlin version, not the compose-bom.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
