# Gradle version catalog — the single source of truth for plugin and dependency
# versions. Build scripts refer to entries as `libs.<dotted-alias>`, so a
# version is only ever written down here.
#
# Version policy: this file backs P0 of the Android refactor. AGP is held at
# 8.9.1 and the Gradle wrapper at 8.11.1 on purpose — moving the build chain
# forward is a separate change that has to be verified on its own. Kotlin is
# introduced at 2.4.20 so new code can be written in Kotlin from now on; the
# Kotlin Gradle plugin compiles Java and Kotlin sources of the same module
# together, so the port can proceed file by file instead of as one big drop.

[versions]
agp = "8.9.1"
kotlin = "2.4.20"

# Jetpack Compose. The BOM is the only place a compose version is written down:
# every androidx.compose.* artifact below is version-less and resolved by it.
#
# These are the newest versions that still work with AGP 8.9.1 / compileSdk 36 --
# deliberate ceilings, not stale values. The next step up in every one of these
# lines (compose 1.12.x, core-ktx 1.19.x, navigation 2.10.x) declares
# minAndroidGradlePluginVersion 9.1.0 and minCompileSdk 37 in its AAR metadata,
# so the build stops in :app:checkDebugAarMetadata. Moving the build chain up is
# a change of its own; until then this is the ceiling. Checked against the AAR
# metadata on 2026-10-02:
#   compose 1.11.4, material3 1.4.0, navigation 2.9.8 -> minAgp 8.6.0
#   core-ktx 1.18.0, activity-compose 1.13.0         -> minAgp 8.9.1
# material3 is 1.4.0 in every BOM from 2025.10 onwards, so this ceiling still
# carries the M3 Expressive navigation components the design asks for.
composeBom = "2026.06.01"
activityCompose = "1.13.0"
navigationCompose = "2.9.8"
coreKtx = "1.18.0"
# Needed by the type-safe navigation routes (@Serializable destination objects).
kotlinxSerialization = "1.11.0"

[libraries]
# --- Compose UI stack (the whole app UI; see the ui/ package) ---
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
# Required since Kotlin 2.0: the Compose compiler ships as a Kotlin plugin and
# its version has to track the Kotlin version, not the compose-bom.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
