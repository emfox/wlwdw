# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    trusted_proxies: '%env(TRUSTED_PROXIES)%'
    csrf_protection: ~

    secret: '%env(APP_SECRET)%'
    http_method_override: true
    annotations: false
    handle_all_throwables: true

    # Note that the session will ONLY be started if you read or write from it.
    # Remove or comment this section to explicitly disable session support.
    session:
        handler_id: ~
        cookie_secure: auto
        cookie_samesite: lax

    # Explicitly keep the current default; the implicit default will flip
    # to false in Symfony 8.0 (and not setting it is deprecated since 7.3).
    property_info:
        with_constructor_extractor: true

    fragments: true
    php_errors:
        log: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
